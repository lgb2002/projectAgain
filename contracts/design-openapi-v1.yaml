openapi: 3.1.0
info:
  title: Micro Asset Marketplace ↔ AI Agent Contract
  version: 1.0.0
  description: 초소형 디지털 자산 거래소/AI 에이전트 공통 설계 API. 실제 구현이 아니라 계약 초안. 실제 결제·권리 자동 이전은 불가하며 DEMO 분리 필수.
servers:
- url: http://localhost:8000
  description: 로컬 Mock/개발 환경만 사용
- url: https://{host}
  variables:
    host:
      default: localhost:8000
      description: 배포 환경별 수동 설정. 실제 키와 URL 하드코딩 금지
security:
- bearerAuth: []
tags:
- name: Auth
- name: Listings
- name: Preferences
- name: Assets
- name: Offers
- name: Transactions
- name: Inspections
- name: AgentActions
- name: System
paths:
  /health:
    get:
      tags:
      - System
      summary: 상태 및 API 버전 조회
      operationId: get_health
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      security: []
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: 회원가입
      operationId: post_auth_register
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegister'
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 로그인 및 단기 토큰 발급
      operationId: post_auth_login
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      security: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: 본인 프로필
      operationId: get_auth_me
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/listings:
    get:
      tags:
      - Listings
      summary: '공개 매물 탐색: DEMO 필터링'
      operationId: get_listings
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: 'PUBLIC: ACTIVE non-demo만 반환. DEMO 환경 전용 토큰일 때 DEMO 매물 허용. 비공개 아카이브 제외.'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum: &id002
          - web_app
          - saas
          - desktop_tool
          - ai_agent
          - mobile_app
          - game
          - module
          - content_asset
          - revenue_site
      - name: lifecycle_status
        in: query
        required: false
        schema:
          type: string
          enum: &id003
          - UNLAUNCHED
          - IN_DEVELOPMENT
          - DISCONTINUED
          - FAILED_COMMERCIALIZATION
          - OPERATING_NO_REVENUE
          - OPERATING_REVENUE
          - ASSET_ONLY
      - name: min_price_krw
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: max_price_krw
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security: []
    post:
      tags:
      - Listings
      summary: 매물 초안 생성
      operationId: post_listings
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
      parameters:
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/listings/{listing_id}:
    get:
      tags:
      - Listings
      summary: 매물 상세 조회
      operationId: get_listing_detail
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - name: listing_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      security: []
    patch:
      tags:
      - Listings
      summary: 판매자 매물 변경·게시 상태 이동
      operationId: patch_listing_patch
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingPatch'
      parameters:
      - name: listing_id
        in: path
        required: true
        schema: *id001
  /api/v1/buyer-preferences/me:
    get:
      tags:
      - Preferences
      summary: 내 매수 성향 조회
      operationId: get_preferences
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags:
      - Preferences
      summary: 내 매수 성향 저장
      operationId: put_preferences
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerPreferences'
  /api/v1/listings/{listing_id}/asset-upload-intents:
    post:
      tags:
      - Assets
      summary: 사설 저장소의 단기 업로드 의도 생성
      operationId: post_asset_upload
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: 판매자만 가능. 서버가 검증/격리 가능한 저장소 링크만 발행. 업로드 완료 후 악성코드 검사가 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUploadIntentCreate'
      parameters:
      - name: listing_id
        in: path
        required: true
        schema: *id001
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/assets/{asset_id}/download-intents:
    post:
      tags:
      - Assets
      summary: 소유권·동의 확인 후 만료형 다운로드 URL 발행
      operationId: post_asset_download_intent
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDownloadIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: PUBLIC_PREVIEW 외의 원본은 권한, 판매자 동의, inspect grant 또는 인계 자격 확인. 기본 접근 거부. URL 짧은 만료와 감사 추적 필수.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDownloadIntentCreate'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema: *id001
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/listings/{listing_id}/assets:
    get:
      tags:
      - Assets
      summary: 권한 있는 파일 메타데이터 열람
      operationId: get_listing_assets
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: 초기 계약은 메타데이터 단건 응답 예시이며 구현 시 AssetPage 목록으로 변경할 경우 minor version 협의. 비공개 원본 다운로드 링크 반환 금지.
      parameters:
      - name: listing_id
        in: path
        required: true
        schema: *id001
  /api/v1/favorites:
    get:
      tags:
      - Preferences
      summary: 본인 찜 매물 목록
      operationId: get_favorites
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - Preferences
      summary: 매물 찜 추가
      operationId: post_favorite_add
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteCreate'
      parameters:
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/favorites/{listing_id}:
    delete:
      tags:
      - Preferences
      summary: 매물 찜 해제
      operationId: delete_favorite_remove
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - name: listing_id
        in: path
        required: true
        schema: *id001
  /api/v1/offers:
    post:
      tags:
      - Offers
      summary: 매수자 가격·조건 제안
      operationId: post_offers
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Agent 실행은 승인된 action_id 경유 필요. 이 직접 경로는 본인 사용자의 세션에 한정.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreate'
      parameters:
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      tags:
      - Offers
      summary: 본인이 참여한 제안 목록
      operationId: get_offers_list
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - name: listing_id
        in: query
        required: false
        schema: *id001
      - name: status
        in: query
        required: false
        schema:
          type: string
  /api/v1/offers/{offer_id}:
    get:
      tags:
      - Offers
      summary: 당사자의 제안 조회
      operationId: get_offer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
      - name: offer_id
        in: path
        required: true
        schema: *id001
  /api/v1/offers/{offer_id}/counter:
    post:
      tags:
      - Offers
      summary: 당사자의 역제안 생성
      operationId: post_offer_counter
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCounter'
      parameters:
      - name: offer_id
        in: path
        required: true
        schema: *id001
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/offers/{offer_id}/accept:
    post:
      tags:
      - Offers
      summary: 제안 수락 및 DEMO 거래 생성
      operationId: post_offer_accept
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: 수락은 오직 제안 수신자만, version 확인, 하나의 exclusive listing에 하나의 거래. 실대금/법적 양도 아님.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCheck'
      parameters:
      - name: offer_id
        in: path
        required: true
        schema: *id001
      - in: header
        name: Idempotency-Key
        description: 재시도 시 같은 값. 값이 같으면 작업 중복 방지.
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/offers/{offer_id}/withdraw:
    post:
      tags:
      - Offers
      summary: 발신자가 진행 중인 제안 철회
      operationId: post_offer_withdraw
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
