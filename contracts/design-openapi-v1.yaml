components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 웹 세션과 별도로 범위·만료가 있는 위임 토큰. MVP는 테스트 전용.
  schemas:
    User:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - USER
          - ADMIN
        email_verified:
          type: boolean
      required:
      - id
      - email
      - role
      - email_verified
    AuthRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
      - email
      - password
    AuthLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AuthToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
            enum:
            - listing:read
            - listing:inspect
            - inspection:write
            - buyer_profile:read
            - offer:draft
            - offer:execute
            - handover:report
      required:
      - access_token
      - token_type
      - expires_at
      - scopes
    ListingCore:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 30
          maxLength: 20000
        category:
          type: string
          enum: *id002
        lifecycle_status:
          type: string
          enum: *id003
        sale_rights_type:
          type: string
          enum: &id005
          - FULL_IP_ASSIGNMENT
          - EXCLUSIVE_LICENSE
          - NON_EXCLUSIVE_LICENSE
          - ASSET_TRANSFER_ONLY
          - BUSINESS_TRANSFER_REVIEW_REQUIRED
        price_krw: &id004
          type: integer
          minimum: 1
          description: 원화 정수. 금액의 소수점/부동소수점 금지
        tech_stack:
          type: array
          items:
            type: string
            maxLength: 60
        included_assets:
          type: array
          items:
            type: string
        excluded_assets:
          type: array
          items:
            type: string
        known_defects:
          type: array
          items:
            type: string
        monthly_cost_estimate_krw:
          type: integer
          minimum: 0
        handover_days_estimate:
          type: integer
          minimum: 0
        seller_support_days:
          type: integer
          minimum: 0
        has_revenue:
          type: boolean
        revenue_krw_claimed:
          type: integer
          minimum: 0
        is_demo:
          type: boolean
          default: false
      required:
      - title
      - description
      - category
      - lifecycle_status
      - sale_rights_type
      - price_krw
      - included_assets
      - excluded_assets
      - known_defects
      - is_demo
    ListingCreate:
      $ref: '#/components/schemas/ListingCore'
    ListingPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 20000
        price_krw: *id004
        known_defects:
          type: array
          items:
            type: string
        monthly_cost_estimate_krw:
          type: integer
          minimum: 0
        status:
          type: string
          enum: &id006
          - DRAFT
          - PENDING_REVIEW
          - ACTIVE
          - PAUSED
          - RESERVED
          - CLOSED
          - REMOVED
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    Listing:
      type: object
      properties:
        id: *id001
        seller_id: *id001
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: *id002
        lifecycle_status:
          type: string
          enum: *id003
        sale_rights_type:
          type: string
          enum: *id005
        price_krw: *id004
        tech_stack:
          type: array
          items:
            type: string
        included_assets:
          type: array
          items:
            type: string
        excluded_assets:
          type: array
          items:
            type: string
        known_defects:
          type: array
          items:
            type: string
        monthly_cost_estimate_krw:
          type: integer
          minimum: 0
        handover_days_estimate:
          type: integer
          minimum: 0
        seller_support_days:
          type: integer
          minimum: 0
        has_revenue:
          type: boolean
        revenue_krw_claimed:
          type: integer
          minimum: 0
        status:
          type: string
          enum: *id006
        verification_status:
          type: string
          enum:
          - UNVERIFIED
          - STATIC_CHECKED
          - EXECUTION_CHECKED
          - PARTIAL
        revenue_claim_verification:
          type: string
          enum:
          - NOT_PROVIDED
          - SELLER_CLAIMED_UNVERIFIED
          - DOCUMENT_REVIEWED
        is_demo:
          type: boolean
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - seller_id
      - title
      - category
      - lifecycle_status
      - sale_rights_type
      - price_krw
      - status
      - verification_status
      - is_demo
      - version
    ListingPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        next_cursor:
          type:
          - string
          - 'null'
        total_estimate:
          type: integer
          minimum: 0
      required:
      - items
      - next_cursor
    BuyerPreferences:
      type: object
      properties:
        max_budget_krw:
          type: integer
          minimum: 0
        min_budget_krw:
          type: integer
          minimum: 0
        skill_level:
          type: string
          enum:
          - NONE
          - BASIC
          - INTERMEDIATE
          - ADVANCED
        objectives:
          type: array
          items:
            type: string
        preferred_tech_stack:
          type: array
          items:
            type: string
        max_monthly_cost_krw:
          type: integer
          minimum: 0
        risk_tolerance:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      required:
      - max_budget_krw
      - skill_level
      - objectives
      - risk_tolerance
    AssetUploadIntentCreate:
      type: object
      properties:
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        asset_type:
          type: string
          enum:
          - SOURCE_ARCHIVE
          - DOCUMENT
          - SCREENSHOT
          - DEMO_VIDEO
          - LICENSE
          - MANIFEST
      required:
      - file_name
      - content_type
      - byte_size
      - sha256
      - asset_type
    AssetUploadIntent:
      type: object
